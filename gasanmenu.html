<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gasan Menu</title>

<style>
:root {
  --bg: #0b0b0d;
  --card: #141418;
  --tab: #25252a;
  --text: #f5f5f7;
  --muted: #a5a6b5;
  --border: #303037;
  --accent: #ff9b58;
}

body.light {
  --bg: #fafafa;
  --card: #fff;
  --tab: #eaeaf0;
  --text: #18181b;
  --muted: #666875;
  --border: #dedee5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, sans-serif;
  transition: background .2s, color .2s;
}

header {
  border-bottom: 1px solid var(--border);
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 23px;
  font-weight: 800;
}

.logo span { color: var(--accent); }

.subtitle {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

.controls {
  display: flex;
  gap: 10px;
}

button {
  cursor: pointer;
  font: inherit;
  color: var(--text);
}

.control-btn {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  padding: 9px 12px;
}

main {
  max-width: 900px;
  margin: 30px auto;
  padding: 0 16px;
}

.week-title {
  color: var(--muted);
  text-align: center;
  margin-bottom: 20px;
  font-size: 14px;
}

.date-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
}

.arrow {
  width: 42px;
  height: 46px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 50%;
}

.arrow:disabled {
  opacity: .3;
  cursor: not-allowed;
}

.dates {
  display: flex;
  flex: 1;
  gap: 4px;
  background: var(--tab);
  padding: 6px;
  border-radius: 15px;
  overflow-x: auto;
}

.date-btn {
  flex: 1;
  min-width: 85px;
  padding: 13px 6px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--muted);
  font-weight: 600;
}

.date-btn.active {
  background: #09090b;
  color: white;
}

body.light .date-btn.active {
  background: white;
  color: #18181b;
}

.menu-list {
  display: grid;
  gap: 14px;
}

.menu-card {
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 16px;
  padding: 22px;
}

.menu-kind {
  display: inline-block;
  background: rgba(255,155,88,.12);
  color: var(--accent);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 700;
}

.menu-name {
  margin: 15px 0 8px;
  font-size: 21px;
  font-weight: 750;
}

.section-label {
  color: var(--muted);
  font-size: 12px;
  margin: 20px 0 10px;
  font-weight: 600;
}

.submenu {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}

.submenu:last-child {
  border-bottom: 0;
}

.submenu::before {
  content: "•";
  color: var(--accent);
}

.nutrition {
  color: var(--muted);
  font-size: 13px;
  margin-top: 16px;
}

.note {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
  margin: 24px 0;
}

.empty {
  border: 1px solid var(--border);
  border-radius: 16px;
  text-align: center;
  padding: 90px 20px;
  color: var(--muted);
}

@media (max-width: 600px) {
  header { padding: 16px; }
  .logo { font-size: 20px; }
  .menu-card { padding: 18px; }
  .menu-name { font-size: 19px; }
  .date-btn { min-width: 78px; }
}
</style>

// ========================================
// WEBSITE LOGIC
// ========================================

const dates = Object.keys(MENUS).sort();
const today = new Date();
const localDate =
  today.getFullYear() + "-" +
  String(today.getMonth() + 1).padStart(2, "0") + "-" +
  String(today.getDate()).padStart(2, "0");

let selectedIndex = dates.indexOf(localDate);
if (selectedIndex === -1) selectedIndex = 0;

let lang = localStorage.getItem("gasan-lang") || "ko";
let theme = localStorage.getItem("gasan-theme") || "dark";

const $ = id => document.getElementById(id);

function formatDate(dateString) {
  const date = new Date(dateString + "T12:00:00");
  const weekdays = lang === "ko"
    ? ["일","월","화","수","목","금","토"]
    : ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  return (
    (date.getMonth() + 1) + "/" +
    date.getDate() +
    " (" + weekdays[date.getDay()] + ")"
  );
}

function renderDates() {
  $("dates").innerHTML = dates.map((date, i) => `
    <button
      class="date-btn ${i === selectedIndex ? "active" : ""}"
      data-index="${i}">
      ${formatDate(date)}
    </button>
  `).join("");

  document.querySelectorAll(".date-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedIndex = Number(btn.dataset.index);
      render();
    });
  });

  $("prevBtn").disabled = selectedIndex === 0;
  $("nextBtn").disabled = selectedIndex === dates.length - 1;
}

function renderMenu() {
  const date = dates[selectedIndex];
  const menu = MENUS[date];
  const english = lang === "en";

  if (!menu || !menu.items || menu.items.length === 0) {
    $("menuList").innerHTML = `
      <div class="empty">
        <div style="font-size:48px">🍽️</div>
        <p>${english ? "No menu available" : "오늘은 메뉴가 없습니다"}</p>
      </div>`;
    $("note").textContent = "";
    return;
  }

  $("menuList").innerHTML = menu.items.map(item => {
    const kind = english ? item.enKind : item.kind;
    const name = english ? item.enName : item.name;

    const sides = (item.submenus || []).map(side => `
      <div class="submenu">
        ${english ? side.enName : side.name}
      </div>
    `).join("");

    const sideSection = sides ? `
      <div class="section-label">
        ${english ? "SIDE DISHES" : "함께 제공되는 메뉴"}
      </div>
      ${sides}
    ` : "";

    const nutrition = item.kcal != null ? `
      <div class="nutrition">
        🔥 ${item.kcal.toLocaleString()} kcal
        ${item.protein != null
          ? ` · 💪 ${item.protein}g ${english ? "protein" : "단백질"}`
          : ""}
      </div>
    ` : "";

    return `
      <article class="menu-card">
        <span class="menu-kind">${kind}</span>
        <div class="menu-name">${name}</div>
        ${sideSection}
        ${nutrition}
      </article>
    `;
  }).join("");

  $("note").textContent = english
    ? (menu.enNote || "Menu items may change without notice.")
    : (menu.note || "메뉴는 사정에 따라 변경될 수 있습니다.");
}

function render() {
  renderDates();
  renderMenu();
  $("langBtn").textContent =
    lang === "ko" ? "🌐 한국어" : "🌐 English";
}

$("prevBtn").addEventListener("click", () => {
  if (selectedIndex > 0) {
    selectedIndex--;
    render();
  }
});

$("nextBtn").addEventListener("click", () => {
  if (selectedIndex < dates.length - 1) {
    selectedIndex++;
    render();
  }
});

$("langBtn").addEventListener("click", () => {
  lang = lang === "ko" ? "en" : "ko";
  localStorage.setItem("gasan-lang", lang);
  render();
});

$("themeBtn").addEventListener("click", () => {
  theme = theme === "dark" ? "light" : "dark";
  localStorage.setItem("gasan-theme", theme);
  applyTheme();
});

function applyTheme() {
  document.body.classList.toggle("light", theme === "light");
  $("themeBtn").textContent = theme === "dark" ? "☾" : "☀";
}

applyTheme();
render();

</script>
