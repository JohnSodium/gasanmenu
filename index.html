<!doctype html>

<head>

<title>Gasan Menu — Daily Menu</title>
<style>
  :root {color-scheme:dark;--bg:#0b0b0d;--surface:#141416;--tab:#272729;--border:#29292d;--text:#f4f4f5;--muted:#9d9da7;--soft:#b7bfd5;--accent:#ffffff;}
  :root.light {color-scheme:light;--bg:#f8f8fa;--surface:#fff;--tab:#eaeaf0;--border:#ddddE4;--text:#202026;--muted:#71717d;--soft:#5c647a;--accent:#1b1b1d;}
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
  body{min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #8bb8ff;outline-offset:4px}
  header{height:70px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 max(30px,calc((100vw - 1100px)/2));gap:16px}
  .brand{display:flex;align-items:center;gap:18px}.brand-icon{font-size:30px;filter:grayscale(.6);line-height:1}.brand h1{margin:0;font-size:22px;letter-spacing:-.7px;color:var(--muted);font-weight:750}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.header-actions{display:flex;gap:24px;align-items:center}.small-btn{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--text);padding:8px 3px;font-weight:650}.small-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  main{max-width:1160px;margin:30px auto;padding:0 32px}.date-picker{display:grid;grid-template-columns:50px minmax(0,1fr) 50px;gap:10px;align-items:center}.arrow{border:1px solid var(--border);border-radius:50%;background:transparent;width:50px;height:50px;color:var(--text);font-size:27px;display:grid;place-items:center;font-weight:300;line-height:1}.arrow:hover{background:var(--surface)}.dates{border-radius:15px;background:var(--tab);padding:7px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.date{height:46px;border:0;background:transparent;color:var(--muted);border-radius:14px;position:relative;font-size:16px;font-weight:650;white-space:nowrap}.date:hover{color:var(--text)}.date.selected{background:var(--bg);color:var(--text)}.date.today:not(.selected):after{content:"";position:absolute;width:7px;height:7px;background:var(--text);border-radius:50%;bottom:3px;left:calc(50% - 3.5px)}
  .menu-panel{margin-top:20px;border:1px solid var(--border);background:var(--surface);border-radius:16px;min-height:348px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:45px 24px;text-align:center}.empty-art{font-size:90px;line-height:1.2;margin-bottom:28px;filter:grayscale(.5)}.empty-message{font-size:22px;letter-spacing:-.45px;color:var(--soft);margin:0}.menu-header{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:650;letter-spacing:.08em;text-transform:uppercase}.menu-date{font-size:25px;margin:0 0 25px;letter-spacing:-.5px}.menu-list{width:min(100%,570px);text-align:left;display:grid;gap:13px}.menu-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:15px 18px;font-size:16px}.menu-item .kind{font-size:13px;color:var(--muted);font-weight:650;margin-right:10px}.menu-item .dish{font-weight:650}.menu-note{color:var(--muted);font-size:14px;margin:22px 0 0;line-height:1.6}.footer{text-align:center;color:var(--muted);font-size:12px;padding:16px 0}
  @media(max-width:600px){header{padding:0 18px}.brand{gap:9px}.brand h1{font-size:18px}.brand-icon{font-size:24px}.header-actions{gap:10px}.small-btn{font-size:13px}.small-btn svg{width:18px;height:18px}main{margin:24px auto;padding:0 15px}.date-picker{grid-template-columns:35px minmax(0,1fr) 35px;gap:6px}.arrow{width:35px;height:35px;font-size:22px}.dates{padding:4px;gap:0;border-radius:11px}.date{height:45px;font-size:12px;border-radius:9px}.menu-panel{min-height:340px;padding:32px 15px}.empty-art{font-size:76px}.empty-message{font-size:19px}.menu-date{font-size:21px}.menu-item{padding:13px;font-size:14px}}

  /* Main dish at the top; its accompanying dishes underneath */
  .menu-list{width:min(100%,690px);gap:15px}
  .menu-item{display:block;text-align:left;padding:20px 22px}
  .menu-item .kind{display:block;font-size:12px;margin:0 0 8px;color:var(--soft)}
  .menu-item .dish{display:block;font-size:20px;line-height:1.45;color:var(--text)}
  .submenu-list{list-style:none;margin:16px 0 0;padding:13px 0 0;border-top:1px solid var(--border);display:grid;gap:10px}
  .submenu-list li{padding-left:16px;position:relative;color:var(--soft);font-size:14px;line-height:1.5}
  .submenu-list li:before{content:"•";position:absolute;left:0;color:var(--muted)}
  .nutrition{margin-top:15px;color:var(--muted);font-size:12px}
  @media(max-width:600px){.menu-item{padding:17px}.menu-item .dish{font-size:17px}}
  
  /* Mobile-friendly date navigation */

/* FIX: Mobile date navigation */
@media (max-width: 600px) {

  .date-picker {
    display: grid;
    grid-template-columns: 35px minmax(0, 1fr) 35px;
    gap: 8px;
    width: 100%;
    align-items: center;
  }

  .arrow {
    width: 35px;
    height: 35px;
    flex-shrink: 0;
    font-size: 22px;
  }

  .dates {
    display: flex;
    gap: 6px;
    padding: 6px;
    min-width: 0;
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    border-radius: 12px;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  .dates::-webkit-scrollbar {
    display: none;
  }

  .date {
    flex: 0 0 84px;
    min-width: 84px;
    height: 48px;
    padding: 0 6px;
    font-size: 12px;
    white-space: nowrap;
    text-align: center;
    border-radius: 10px;
    scroll-snap-align: center;
  }

  .date.selected {
    background: var(--bg);
    color: var(--text);
  }

  .date.today:not(.selected)::after {
    bottom: 3px;
  }
}


</style>

  <div class="header-actions">
    <button class="small-btn" id="languageBtn" aria-label="Change language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span id="languageLabel">한국어</span></button>
    <button class="small-btn" id="themeBtn" aria-label="Toggle light and dark theme"><svg viewBox="0 0 24 24"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></svg></button>
  </div>
</header>
<main>
  <nav class="date-picker" aria-label="Choose a date">
    <button class="arrow" id="previousBtn" aria-label="Previous five days">‹</button>
    <div class="dates" id="dateTabs" role="group" aria-label="Menu dates"></div>
    <button class="arrow" id="nextBtn" aria-label="Next five days">›</button>
  </nav>
  <section class="menu-panel" id="menuPanel" aria-live="polite"></section>
  <div class="footer" id="footer">Choose a date to view the daily menu.</div>

const localeWeekdays = {ko:["일","월","화","수","목","금","토"],en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]};
const today = new Date(); today.setHours(12,0,0,0);
const copy = {ko:{none:"오늘은 메뉴가 없습니다",noDate:"이 날짜에는 메뉴가 없습니다",title:"오늘의 메뉴",otherTitle:"일일 메뉴",footer:"날짜를 선택하여 메뉴를 확인하세요."},en:{none:"No menu today",noDate:"No menu available for this date",title:"Today's Menu",otherTitle:"Daily Menu",footer:"Choose a date to view the daily menu."}};
let language = "ko";
let selected = new Date(today);

// Find Monday of the current week
function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}

let windowStart = getMonday(today);
function addDays(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d}
function key(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`}
function sameDay(a,b){return key(a)===key(b)}
function formatTab(d){return `${d.getMonth()+1}/${d.getDate()} (${localeWeekdays[language][d.getDay()]})`}
function render(){
  const tabs=document.getElementById("dateTabs"); tabs.replaceChildren();
  for(let i=0;i<5;i++){
    const date=addDays(windowStart,i);const button=document.createElement("button");button.type="button";button.className="date"+(sameDay(date,selected)?" selected":"")+(sameDay(date,today)?" today":"");button.textContent=formatTab(date);button.setAttribute("aria-pressed",sameDay(date,selected));button.setAttribute("aria-label",date.toLocaleDateString(language==="ko"?"ko-KR":"en-US",{dateStyle:"full"}));button.addEventListener("click",()=>{selected=date;render()});tabs.append(button);
  }
  const panel=document.getElementById("menuPanel");panel.replaceChildren();const menu=MENUS[key(selected)];
  if(!menu||!menu.items||menu.items.length===0){
    const art=document.createElement("div");art.className="empty-art";art.textContent="👨‍🍳";art.setAttribute("aria-hidden","true");const msg=document.createElement("p");msg.className="empty-message";msg.textContent=sameDay(selected,today)?copy[language].none:copy[language].noDate;panel.append(art,msg);
  }else{
    const sub=document.createElement("p");sub.className="menu-header";sub.textContent=sameDay(selected,today)?copy[language].title:copy[language].otherTitle;
    const heading=document.createElement("h2");heading.className="menu-date";heading.textContent=selected.toLocaleDateString(language==="ko"?"ko-KR":"en-US",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
    const list=document.createElement("div");list.className="menu-list";
    for(const item of menu.items){
      const row=document.createElement("article");row.className="menu-item";
      const kind=document.createElement("span");kind.className="kind";
      kind.textContent=language==="ko"?item.kind:(item.enKind||item.kind);
      const dish=document.createElement("strong");dish.className="dish";
      dish.textContent=language==="ko"?item.name:(item.enName||item.name);
      row.append(kind,dish);
      if(item.submenus && item.submenus.length){
        const sides=document.createElement("ul");sides.className="submenu-list";
        for(const side of item.submenus){
          const entry=document.createElement("li");
          entry.textContent=language==="ko"?side.name:(side.enName||side.name);
          sides.append(entry);
        }
        row.append(sides);
      }
      if(item.kcal!=null){
        const nutrition=document.createElement("div");nutrition.className="nutrition";
        nutrition.textContent=`${Number(item.kcal).toLocaleString()} kcal`+
          (item.protein!=null?` · ${language==="ko"?"단백질":"Protein"} ${item.protein}g`:"");
        row.append(nutrition);
      }
      list.append(row);
    }
    panel.append(sub,heading,list);
    const note=language==="ko"?menu.note:menu.enNote;if(note){const p=document.createElement("p");p.className="menu-note";p.textContent=note;panel.append(p)}
  }
  document.getElementById("languageLabel").textContent=language==="ko"?"한국어":"English";
  document.getElementById("footer").textContent=copy[language].footer;
  document.documentElement.lang=language;
}
document.getElementById("previousBtn").addEventListener("click", () => {
  windowStart = addDays(windowStart, -7);
  selected = new Date(windowStart);
  render();
});

document.getElementById("nextBtn").addEventListener("click", () => {
  windowStart = addDays(windowStart, 7);
  selected = new Date(windowStart);
  render();
});
document.getElementById("languageBtn").addEventListener("click",()=>{language=language==="ko"?"en":"ko";render()});
document.getElementById("themeBtn").addEventListener("click",()=>document.documentElement.classList.toggle("light"));
render();
